name: Portfolio validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Validate portfolio registry and governance
        run: ruby scripts/validate_portfolio.rb
      - name: Test portfolio validation guardrails
        run: ruby scripts/test_validate_portfolio.rb
